name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Slang shader compiler release used to build the shaders (https://github.com/shader-slang/slang).
  SLANG_VERSION: 2026.22
  # Keep in sync with the clang version used for local development, so that
  # clang-format and clang-tidy give the same results everywhere.
  LLVM_VERSION: 23

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (clang)
            os: windows-2025
            preset: windows-clang
          - name: Linux (clang)
            os: ubuntu-24.04
            preset: linux-clang

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install clang and Ninja (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$LLVM_VERSION" all
          sudo apt-get update
          # Ninja, plus the windowing headers SDL3 needs to build its X11 and Wayland backends.
          sudo apt-get install -y ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev \
            libdrm-dev libgbm-dev libdbus-1-dev libibus-1.0-dev libudev-dev
          # Expose the unversioned tool names (clang, clang++, ld.lld, clang-format, clang-tidy).
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"

      - name: Install clang and Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm ninja --no-progress -y

      - name: Install the Slang shader compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q "https://github.com/shader-slang/slang/releases/download/v$SLANG_VERSION/slang-$SLANG_VERSION-linux-x86_64.tar.gz"
          mkdir -p "$HOME/slang"
          tar -xzf "slang-$SLANG_VERSION-linux-x86_64.tar.gz" -C "$HOME/slang"
          echo "$HOME/slang/bin" >> "$GITHUB_PATH"

      - name: Install the Slang shader compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/shader-slang/slang/releases/download/v$env:SLANG_VERSION/slang-$env:SLANG_VERSION-windows-x86_64.zip" -OutFile slang.zip
          Expand-Archive slang.zip -DestinationPath "$env:USERPROFILE\slang"
          "$env:USERPROFILE\slang\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Check formatting
        if: runner.os == 'Linux'
        run: git ls-files '*.hpp' '*.cpp' | xargs clang-format --dry-run --Werror

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DMAGE_WARNINGS_AS_ERRORS=ON -DMAGE_ENABLE_CLANG_TIDY=ON

      - name: Build (Debug)
        run: cmake --build --preset ${{ matrix.preset }}-debug

      - name: Test (Debug)
        run: ctest --preset ${{ matrix.preset }}-debug

      - name: Build (Release)
        run: cmake --build --preset ${{ matrix.preset }}-release

      - name: Test (Release)
        run: ctest --preset ${{ matrix.preset }}-release
